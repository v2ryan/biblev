<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Parallel Bible Reader</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f5f5f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #2c3e50;
      color: white;
      padding: 15px 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    header h1 { font-size: 24px; margin-bottom: 10px; }

    .controls {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      align-items: center;
    }

    .control-group { display: flex; gap: 10px; align-items: center; }

    label { font-size: 14px; color: #ecf0f1; }

    select, button {
      padding: 8px 12px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
    }

    select { background: white; color: #2c3e50; }

    button {
      background: #3498db;
      color: white;
      transition: background 0.3s;
    }

    button:hover { background: #2980b9; }

    button:disabled { background: #95a5a6; cursor: not-allowed; }

    .main-container { display: flex; flex: 1; overflow: hidden; }

    .bible-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: white;
      border-right: 2px solid #ddd;
    }

    .bible-pane:last-child { border-right: none; }

    .pane-header {
      background: #34495e;
      color: white;
      padding: 10px 15px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .pane-header select { max-width: 360px; }

    .verse-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      line-height: 1.8;
    }

    .verse {
      margin-bottom: 15px;
      padding: 8px;
      border-radius: 4px;
      transition: background 0.2s;
    }

    .verse:hover { background: #f8f9fa; }

    .verse-number {
      display: inline-block;
      font-weight: bold;
      color: #3498db;
      min-width: 35px;
      margin-right: 8px;
    }

    .verse-text { display: inline; font-size: 16px; color: #333; }

    .loading { text-align: center; padding: 40px; color: #7f8c8d; font-size: 18px; }
    .error { text-align: center; padding: 40px; color: #e74c3c; font-size: 16px; }

    .chapter-title {
      font-size: 24px;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid #3498db;
    }

    @media (max-width: 768px) {
      .main-container { flex-direction: column; }
      .bible-pane { border-right: none; border-bottom: 2px solid #ddd; }
    }

    #toast {
      visibility: hidden;
      min-width: 250px;
      margin-left: -125px;
      background-color: #333;
      color: #fff;
      text-align: center;
      border-radius: 8px;
      padding: 16px;
      position: fixed;
      z-index: 1000;
      left: 50%;
      top: 30px;
      font-size: 17px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      transition: visibility 0s, opacity 0.5s linear;
      opacity: 0;
    }

    #toast.show { visibility: visible; opacity: 1; }
  </style>
</head>

<body>
  <header>
    <h1>📖 Parallel Bible Reader</h1>
    <div class="controls">
      <div class="control-group">
        <label>Book:</label>
        <select id="bookSelect"></select>
      </div>
      <div class="control-group">
        <label>Chapter:</label>
        <select id="chapterSelect"></select>
      </div>
      <div class="control-group">
        <button id="prevChapter">← Previous</button>
        <button id="nextChapter">Next →</button>
      </div>
    </div>
  </header>

  <div class="main-container">
    <div class="bible-pane">
      <div class="pane-header">
        <span id="leftPaneTitle">Left: JSON Files</span>
        <select id="leftVersionSelect"></select>
      </div>
      <div id="leftContent" class="verse-container">
        <div class="loading">Loading...</div>
      </div>
    </div>

    <div class="bible-pane">
      <div class="pane-header">
        <span id="rightPaneTitle">Right: 和合本 (hb.fhl.net API)</span>
        <select id="rightVersionSelect" disabled>
          <option value="unv">和合本 (Union Version)</option>
        </select>
      </div>
      <div id="rightContent" class="verse-container">
        <div class="loading">Loading...</div>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    /** =========================
     *  Parallel Bible Reader
     *  Clean Full Script (drop-in)
     *  ========================= */

      'GerElb1871': { lang: 'de', name: 'Elberfelder Bible 德語愛爾伯費德譯本' },
      'GerElb1905': { lang: 'de', name: 'Elberfelder Unrevised 德語愛爾伯費德未修訂版' },
      'GerGruenewald': { lang: 'de', name: 'Grünewald Bible 德語格呂內瓦爾德聖經' },
      'GerLeoNA28': { lang: 'de', name: 'Leonberg NT 德語里昂貝格新約' },
      'GerMenge': { lang: 'de', name: 'Menge Bible 德語門格譯本' },

      'GerZurcher': { lang: 'de', name: 'Zurich Bible 德語蘇黎世聖經' },

      'GreVamvas': { lang: 'el', name: 'Vamvas Greek Bible 現代希臘語譯本' },

      'Haitian': { lang: 'ht', name: 'Haitian Creole Bible 海地克里奧爾語聖經' },
      'HebModern': { lang: 'he', name: 'Modern Hebrew Bible 現代希伯來語聖經' },
      'HunKar': { lang: 'hu', name: 'Karoli Bible 匈牙利語卡羅利譯本' },

      'JPS': { lang: 'en', name: 'Jewish Publication Society OT 猶太出版協會舊約' },

      'JapBungo': { lang: 'ja', name: 'Japanese Classical Bible 日語文語譯聖經' },
      'JapDenmo': { lang: 'ja', name: 'Japanese Denmo Bible 日語電網聖經' },
      'JapKougo': { lang: 'ja', name: 'Japanese Colloquial Bible 日語口語譯本' },

      'KJV': { lang: 'en', name: 'King James Version (1769) 欽定版聖經' },
      'KJVA': { lang: 'en', name: 'King James Version with Apocrypha 欽定版（含次經）' },
      'KJVPCE': { lang: 'en', name: 'KJV Pure Cambridge Edition 欽定版劍橋純正本' },

      'KLV': { lang: 'tlh', name: 'Klingon Bible 克林貢語聖經' },

      'KorHKJV': { lang: 'ko', name: 'Korean King James Version 韓文欽定版' },
      'KorRV': { lang: 'ko', name: 'Korean Revised Version 韓文修訂譯本' },

      'LEB': { lang: 'en', name: 'Lexham English Bible 萊克瑟姆英語聖經' },

      'TR': { lang: 'grc', name: 'Textus Receptus 公認經文' },
      'WLC': { lang: 'hbo', name: 'Westminster Leningrad Codex 威斯敏斯特列寧格勒抄本' },
      'Vulgate': { lang: 'la', name: 'Latin Vulgate 拉丁通行本' },
      'YLT': { lang: 'en', name: 'Young’s Literal Translation (1898) 楊氏直譯本' }
    };

    // DOM elements
    const elements = {
      bookSelect: document.getElementById('bookSelect'),
      chapterSelect: document.getElementById('chapterSelect'),
      leftVersionSelect: document.getElementById('leftVersionSelect'),
      rightVersionSelect: document.getElementById('rightVersionSelect'),
      leftContent: document.getElementById('leftContent'),
      rightContent: document.getElementById('rightContent'),
      prevChapter: document.getElementById('prevChapter'),
      nextChapter: document.getElementById('nextChapter')
    };

    // State management
    const state = {
      leftBible: null,
      rightApiData: null,
      availableVersions: Object.keys(TRANSLATIONS),
      currentBook: 0,
      currentChapter: 0,
      rightApiVersion: 'unv',
      chineseBookNames: []
    };

    function getChineseBookNames() {
      return [
        '創', '出', '利', '民', '申', '書', '士', '得', '撒上', '撒下',
        '王上', '王下', '代上', '代下', '拉', '尼', '斯', '伯', '詩', '箴',
        '傳', '歌', '賽', '耶', '哀', '結', '但', '何', '珥', '摩',
        '俄', '拿', '彌', '鴻', '哈', '番', '該', '亞', '瑪',
        '太', '可', '路', '約', '徒', '羅', '林前', '林後', '加', '弗',
        '腓', '西', '帖前', '帖後', '提前', '提後', '多', '門', '來', '雅',
        '彼前', '彼後', '約壹', '約貳', '約參', '猶', '啟'
      ];
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function clearContainer(container) {
      while (container.firstChild) container.removeChild(container.firstChild);
    }

    function showLoading(container) {
      clearContainer(container);
      const div = document.createElement('div');
      div.className = 'loading';
      div.textContent = 'Loading...';
      container.appendChild(div);
    }

    function showError(container, message) {
      clearContainer(container);
      const div = document.createElement('div');
      div.className = 'error';
      div.textContent = message;
      container.appendChild(div);
    }

    function loadAvailableVersions() {
      return Object.keys(TRANSLATIONS);
    }

    async function loadBibleVersion(version) {
      const response = await fetch(`json/${version}.json`);
      if (!response.ok) throw new Error(`Failed to load json/${version}.json`);
      return await response.json();
    }

    async function loadFromAPI(bookId, chapter, version = 'unv') {
      // hb.fhl.net API
      const url = `https://hb.fhl.net/api/qb.php?bid=${bookId}&chap=${chapter}&version=${version}`;
      const response = await fetch(url);

      // Common CORS failure: browser blocks before you can read body; fetch throws TypeError.
      if (!response.ok) throw new Error(`API HTTP ${response.status}`);

      const data = await response.json();
      if (data.status !== 'success' || !data.record) {
        throw new Error('Invalid API response');
      }
      return data;
    }

    function initializeVersionSelects() {
      clearContainer(elements.leftVersionSelect);

      const sorted = [...state.availableVersions].sort((a, b) => a.localeCompare(b));
      for (const version of sorted) {
        const opt = document.createElement('option');
        opt.value = version;
        opt.textContent = `${version} — ${TRANSLATIONS[version]?.name ?? version}`;
        elements.leftVersionSelect.appendChild(opt);
      }

      // default
      elements.leftVersionSelect.value = sorted.includes('KJV') ? 'KJV' : sorted[0] || '';
    }

    function initializeBookSelect() {
      if (!state.leftBible?.books?.length) return;

      clearContainer(elements.bookSelect);
      state.leftBible.books.forEach((book, index) => {
        const opt = document.createElement('option');
        opt.value = String(index);
        const zh = state.chineseBookNames[index];
        opt.textContent = zh ? `${zh} ${book.name}` : book.name;
        elements.bookSelect.appendChild(opt);
      });

      elements.bookSelect.value = String(state.currentBook);
    }

    function initializeChapterSelect() {
      if (!state.leftBible?.books?.[state.currentBook]) return;

      const book = state.leftBible.books[state.currentBook];
      clearContainer(elements.chapterSelect);

      book.chapters.forEach((ch, index) => {
        const opt = document.createElement('option');
        opt.value = String(index);
        // safer display: prefer chapter.chapter if present, else index+1
        const chapNo = (ch && typeof ch.chapter !== 'undefined') ? ch.chapter : (index + 1);
        opt.textContent = `Chapter ${chapNo}`;
        elements.chapterSelect.appendChild(opt);
      });

      elements.chapterSelect.value = String(state.currentChapter);
    }

    function displayVersesFromJSON(bible, container, bookIndex, chapterIndex) {
      clearContainer(container);

      const book = bible?.books?.[bookIndex];
      const chapter = book?.chapters?.[chapterIndex];

      if (!book || !chapter) {
        showError(container, 'Chapter not found (JSON)');
        return;
      }

      const titleDiv = document.createElement('div');
      titleDiv.className = 'chapter-title';
      titleDiv.textContent = `${book.name} ${chapter.chapter ?? (chapterIndex + 1)}`;
      container.appendChild(titleDiv);

      (chapter.verses || []).forEach(v => {
        const verseDiv = document.createElement('div');
        verseDiv.className = 'verse';

        const verseNumber = document.createElement('span');
        verseNumber.className = 'verse-number';
        verseNumber.textContent = v.verse ?? '';

        const verseText = document.createElement('span');
        verseText.className = 'verse-text';
        verseText.textContent = v.text ?? '';

        verseDiv.appendChild(verseNumber);
        verseDiv.appendChild(verseText);
        container.appendChild(verseDiv);
      });
    }

    function displayVersesFromAPI(apiData, container, bookIndex, chapterNo) {
      clearContainer(container);

      const records = apiData?.record;
      if (!records || !records.length) {
        showError(container, 'No verses found (API)');
        return;
      }

      const zh = state.chineseBookNames[bookIndex] || '';
      const titleDiv = document.createElement('div');
      titleDiv.className = 'chapter-title';
      titleDiv.textContent = `${zh} ${chapterNo}`;
      container.appendChild(titleDiv);

      records.forEach(r => {
        const verseDiv = document.createElement('div');
        verseDiv.className = 'verse';

        const verseNumber = document.createElement('span');
        verseNumber.className = 'verse-number';
        verseNumber.textContent = r.sec ?? r.verse ?? '';

        const verseText = document.createElement('span');
        verseText.className = 'verse-text';
        verseText.textContent = r.bible_text ?? '';

        verseDiv.appendChild(verseNumber);
        verseDiv.appendChild(verseText);
        container.appendChild(verseDiv);
      });
    }

    function updateNavigationButtons() {
      elements.prevChapter.disabled = (state.currentBook === 0 && state.currentChapter === 0);

      const lastBookIndex = (state.leftBible?.books?.length ?? 1) - 1;
      const lastChapterIndex = (state.leftBible?.books?.[lastBookIndex]?.chapters?.length ?? 1) - 1;

      elements.nextChapter.disabled = (state.currentBook === lastBookIndex && state.currentChapter === lastChapterIndex);
    }

    async function loadRightSideFromAPI() {
      showLoading(elements.rightContent);

      try {
        const apiBookId = state.currentBook + 1;
        const apiChapterNo = state.currentChapter + 1;

        const apiData = await loadFromAPI(apiBookId, apiChapterNo, state.rightApiVersion);
        state.rightApiData = apiData;

        displayVersesFromAPI(apiData, elements.rightContent, state.currentBook, apiChapterNo);
      } catch (err) {
        // CORS often appears as TypeError: Failed to fetch
        const msg = (err && err.message) ? err.message : String(err);
        const hint = (msg.toLowerCase().includes('failed to fetch'))
          ? ' (可能係 CORS / 網絡限制：GitHub Pages 常見)'
          : '';
        showError(elements.rightContent, `Error loading from API: ${msg}${hint}`);
      }
    }

    async function updateDisplay() {
      try {
        // left
        displayVersesFromJSON(state.leftBible, elements.leftContent, state.currentBook, state.currentChapter);

        // right
        await loadRightSideFromAPI();

        updateNavigationButtons();
      } catch (err) {
        console.error('updateDisplay error:', err);
      }
    }

    function navigatePrevious() {
      if (!state.leftBible) return;

      if (state.currentChapter > 0) {
        state.currentChapter--;
      } else if (state.currentBook > 0) {
        state.currentBook--;
        state.currentChapter = state.leftBible.books[state.currentBook].chapters.length - 1;
      }

      elements.bookSelect.value = String(state.currentBook);
      elements.chapterSelect.value = String(state.currentChapter);
      updateDisplay();
    }

    function navigateNext() {
      if (!state.leftBible) return;

      const currentBookData = state.leftBible.books[state.currentBook];
      const lastChapterIndex = currentBookData.chapters.length - 1;

      if (state.currentChapter < lastChapterIndex) {
        state.currentChapter++;
      } else if (state.currentBook < state.leftBible.books.length - 1) {
        state.currentBook++;
        state.currentChapter = 0;
      }

      elements.bookSelect.value = String(state.currentBook);
      elements.chapterSelect.value = String(state.currentChapter);
      updateDisplay();
    }

    async function loadLeftVersion() {
      const version = elements.leftVersionSelect.value;
      const meta = TRANSLATIONS[version] || { name: version };

      showLoading(elements.leftContent);
      showToast(`File: ${version}.json | ${meta.name}`);

      const titleElem = document.getElementById('leftPaneTitle');
      if (titleElem) titleElem.textContent = `Left: ${version} — ${meta.name}`;

      try {
        const bible = await loadBibleVersion(version);
        state.leftBible = bible;

        // reset indices if out of range
        state.currentBook = Math.min(state.currentBook, (bible.books?.length ?? 1) - 1);
        state.currentChapter = 0;

        initializeBookSelect();
        initializeChapterSelect();
        await updateDisplay();
      } catch (err) {
        const msg = (err && err.message) ? err.message : String(err);
        showError(elements.leftContent, `Error loading ${version}: ${msg}`);
      }
    }

    function bindEvents() {
      elements.leftVersionSelect.addEventListener('change', loadLeftVersion);

      elements.bookSelect.addEventListener('change', () => {
        state.currentBook = parseInt(elements.bookSelect.value, 10) || 0;
        state.currentChapter = 0;
        initializeChapterSelect();
        updateDisplay();
      });

      elements.chapterSelect.addEventListener('change', () => {
        state.currentChapter = parseInt(elements.chapterSelect.value, 10) || 0;
        updateDisplay();
      });

      elements.prevChapter.addEventListener('click', navigatePrevious);
      elements.nextChapter.addEventListener('click', navigateNext);

      document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft' && !elements.prevChapter.disabled) navigatePrevious();
        if (e.key === 'ArrowRight' && !elements.nextChapter.disabled) navigateNext();
      });
    }

    async function init() {
      try {
        state.availableVersions = loadAvailableVersions();
        state.chineseBookNames = getChineseBookNames();

        initializeVersionSelects();
        bindEvents();

        await loadLeftVersion();
      } catch (err) {
        console.error('init error:', err);
        showError(elements.leftContent, 'Failed to initialize app');
        showError(elements.rightContent, 'Failed to initialize app');
      }
    }

    init();
  </script>
</body>
</html>
